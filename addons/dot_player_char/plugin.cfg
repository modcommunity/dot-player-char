[plugin]

name="dot-player-char"
description="Who a player looks like, in one addon: body metrics the capsule, the crouch test, the camera and the hitbox all read from one place; a bounded customisation document a server validates without loading any art; a 3D rig with named mounts and a plan of what goes in them; a 2D sheet with layered overlays and a facing; a locomotion state machine with hysteresis driving either of them; and dead bodies that fall as ragdolls, with death reactions a server picks and replicates. Depends on dot-core and dot-player."
author="dot"
version="0.2.0"
script="dot_player_char_plugin.gd"
